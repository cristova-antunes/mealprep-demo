allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@prisma/orm-postgres":
    skills: true
  prisma:
    skills: true
skills:
  dirs:
    - .claude/skills
